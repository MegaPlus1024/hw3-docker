services:
  app:
    build: .
    environment:
      PORT: "8000"
      GREETING: "${GREETING:-Hello, Docker!}"
      STORAGE: sqlite
      DATA_FILE: /data/counter.db
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8000"
    volumes:
      - sqlite_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

volumes:
  sqlite_data:
